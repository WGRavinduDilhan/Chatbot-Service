<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADI | AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">

        <div class="header">
            <div class="header-icon" aria-hidden="true">👽</div>
            <div class="header-title">
                <div class="eyebrow"><span class="status-dot"></span> PERSONAL AI WORKSPACE</div>
                <h1>RADI Assistant</h1>
                <p>Powered by gemini-3.5-flash-lite <span class="separator">/</span> Ready to help</p>
            </div>
            <span class="badge free"><i class="fa-solid fa-bolt"></i> Fast</span>
        </div>

        <div id="message-area">
            <div class="msg bot slide-in">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="bubble">Hello! 👋 I'm your AI assistant powered by <strong>gemini-3.5-flash-lite</strong>. Ask me anything!</div>
            </div>
        </div>

        <div class="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion('Tell me a joke')"><i class="fa-regular fa-face-smile-wink"></i> Tell me a joke</button>
            <button class="suggestion-btn" onclick="sendSuggestion('What is the weather today?')"><i class="fa-solid fa-cloud-sun"></i> Weather info</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Give me a fun fact')"><i class="fa-solid fa-lightbulb"></i> Fun fact</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Explain Docker in simple terms')"><i class="fa-brands fa-docker"></i> Explain Docker</button>
        </div>

        <div class="input-bar">
            <div class="input-wrap">
                <textarea id="user-input" placeholder="Message RADI..." rows="1" aria-label="Message RADI"></textarea>
                <span class="input-hint">Enter to send <span>/</span> Shift + Enter for a new line</span>
            </div>
            <button id="send-btn" aria-label="Send message" title="Send message"><i class="fa-solid fa-arrow-up"></i></button>
            <button id="clear-btn" aria-label="Clear conversation" title="Clear conversation"><i class="fa-solid fa-trash-can"></i></button>
        </div>

        <div class="footer-note"><span>RADI</span> uses Google Gemini <i class="fa-solid fa-circle"></i> FastAPI</div>

    </main>

    <!-- Script loaded at the END of body, AFTER all HTML elements are created -->
    <script src="script.js"></script>

</body>
</html>
