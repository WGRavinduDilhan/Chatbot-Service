<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot Pro : Powered by Gemini</title>
    <style>
         * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
                
        }

        .container {
            width: 100%;
            max-width: 720px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            background-color: #161b22;
            border-radius: 16px;
            border: 1 px solid #30363d;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background-color: linear-gradient(135deg, #1a237e, #0d47a1);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .header-icon { font-size: 28px; }
        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            color: #e6edf3;
        }
        .header-text p {
            margin-left: 12px;
            opacity: 0.75;
            margin-top: 2px;
        }
        .badge {
            margin-top: auto;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.free { background: #1b5e20; color: #a5d6a7;}

        /* Styles for Message Area */ 

        #message-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        #message-area::-webkit-scrollbar {
            width: 8px;
        }
        #message-area::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .msg { display: flex; gap: 10px; max-width: 100%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse;}
        .msg.bot { align-self: flex-start; }

        .avatar {
            width: 34px; height: 34px;
            background-color: #30363d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }

        .msg.user .avatar { background-color: #1565c0; }
        .msg.bot .avatar { background-color: #1b5e20; }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user .bubble {
            background: #1c3a5f;
            border-bottom-right-radius: 4px;
            
        }

        .msg.bot .bubble {
            background: #1c2a1c;
            border-bottom-left-radius: 4px;
            border: 1px solid #1565c0;
        }

        /* typing indicator */
        .typing-dots span {
            display: inline-block;
            width: 8px; height: 8px;
            margin: 0 2px;
            background: #4caf50;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-7px); }
        }

        /* Styles for Suggestions */
        .suggestions {
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .suggestion-btn {
            background: #21262d;
            color: #8d949e;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: #30363d; color: #c9d1d9; border-color: #8d949e;
        }

        /* Styles for Input Bar */
        .input-bar {
            display: flex;
            gap: 8px;
            padding: 14px 16px;
            border-top: 1px solid #30363d;
            align-items: flex-end;
        }

        #user-input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #e6edf3;
            padding: 10px 14px;
            font-size: 14px;
            resize: none; max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus { border-color: #1565c0; }

        #send-btn {
            background: #2e7d32;
            border: none; color: white;
            width: 42px; height: 42px;
            border-radius: 10px; font-size: 18px;
            cursor: pointer; transition: background 0.2s;
            flex-shrink: 0;
       }
       #send-btn:hover    { background: #388e3c; }
       #send-btn:disabled { background: #1b2a1b; cursor: not-allowed; }

       #clear-btn {
      background: #21262d;
      border: 1px solid #30363d; color: #8b949e;
      padding: 0 12px; height: 42px;
      border-radius: 10px; font-size: 12px;
      cursor: pointer; transition: all 0.2s;
      }

      #clear-btn:hover { background: #30363d; color: #e6edf3; }

      .footer-note {
      text-align: center;
      font-size: 11px;
      color: #484f58;
      padding: 6px;
     }

    @media (max-width: 480px) {
        .container { max-width: 100%; height: 100vh; border-radius: 0; }
        .header-title h1 { font-size: 16px; }
        .header-text p { font-size: 11px; }
        .suggestion-btn { font-size: 10px; padding: 4px 10px; }
        #user-input { font-size: 13px; }
        }


    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <div class="header-icon">👽</div> 
            <div class="header-title">
                <h1>ChatBot  RADI</h1>
                <p>Powered by Gemini 2.0 Flash</p>
            </div>
            <span class="badge free">Free Plan</span>
        </div>

        <div id="message-area">
            <!-- Messages will be dynamically added here -->
            <div class="msg bot">
                <div class="avatar">👽</div>
                <div class="bubble">Hello! 🫶🧠 I'm powered by <strong>Gemini 2.0 Flash</strong> (free version)!
                Ask me anything! i can remember everything you tell me.</div>
            </div>
        </div>

        <div class="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion('Tell me a joke')">Tell me a joke 👅</button>
            <button class="suggestion-btn" onclick="sendSuggestion('What is the weather today?')">What is the weather today? 🌤️</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Give me a fun fact')">Give me a fun fact! 😆</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Explain Docker in simple terms')">🐳 Explain Docker</button>
        </div>

        <div class="input-bar">
            <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
            <button id="send-btn">❇️</button>
            <button id="clear-btn">Clear ❌</button>
        </div>

        <div class="footer-note"> Powered by Google Gemini (Free Tier) · FastAPI </div>

    </div>

    <script>

        // Session management using localStorage
        let sessionId = sessionStorage.getItem('sessionId');
        if (!sessionId) {
            sessionId = 'user-' + Math.random().toString(36).substr(2, 9);
            sessionStorage.setItem('ChatSessionId', sessionId);
        }

    </script>

</body>
</html>
