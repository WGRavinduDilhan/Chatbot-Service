<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADI Chat Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">

        <div class="header">
            <div class="header-icon">👽</div> 
            <div class="header-title">
                <h1>RADI Assistant</h1>
                <p>Powered by Gemini 2.5 Flash</p>
            </div>
            <span class="badge free"><i class="fa-solid fa-bolt"></i> Fast</span>
        </div>

        <div id="message-area">
            <div class="msg bot slide-in">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="bubble">Hello! 👋 I'm your AI assistant powered by <strong>Gemini 2.5 Flash</strong>. Ask me anything!</div>
            </div>
        </div>

        <div class="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion('Tell me a joke')"><i class="fa-regular fa-face-smile-wink"></i> Tell me a joke</button>
            <button class="suggestion-btn" onclick="sendSuggestion('What is the weather today?')"><i class="fa-solid fa-cloud-sun"></i> Weather info</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Give me a fun fact')"><i class="fa-solid fa-lightbulb"></i> Fun fact</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Explain Docker in simple terms')"><i class="fa-brands fa-docker"></i> Explain Docker</button>
        </div>

        <div class="input-bar">
            <textarea id="user-input" placeholder="Message RADI..." rows="1"></textarea>
            <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            <button id="clear-btn"><i class="fa-solid fa-trash-can"></i></button>
        </div>

        <div class="footer-note"> Powered by Google Gemini (Free Tier) · FastAPI </div>

    </div>

    <!-- Script loaded at the END of body, AFTER all HTML elements are created -->
    <script src="script.js"></script>

</body>
</html>
