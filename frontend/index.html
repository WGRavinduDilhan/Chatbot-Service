<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot Pro : Powered by Gemini</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="container">

        <div class="header">
            <div class="header-icon">👽</div> 
            <div class="header-title">
                <h1>ChatBot  RADI</h1>
                <p>Powered by Gemini 2.0 Flash</p>
            </div>
            <span class="badge free">Free Plan</span>
        </div>

        <div id="message-area">
            <!-- Messages will be dynamically added here -->
            <div class="msg bot">
                <div class="avatar">👽</div>
                <div class="bubble">Hello! 🫶🧠 I'm powered by <strong>Gemini 2.0 Flash</strong> (free version)!
                Ask me anything! i can remember everything you tell me.</div>
            </div>
        </div>

        <div class="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion('Tell me a joke')">Tell me a joke 👅</button>
            <button class="suggestion-btn" onclick="sendSuggestion('What is the weather today?')">What is the weather today? 🌤️</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Give me a fun fact')">Give me a fun fact! 😆</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Explain Docker in simple terms')">🐳 Explain Docker</button>
        </div>

        <div class="input-bar">
            <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
            <button id="send-btn">❇️</button>
            <button id="clear-btn">Clear ❌</button>
        </div>

        <div class="footer-note"> Powered by Google Gemini (Free Tier) · FastAPI </div>

    </div>

    <!-- Script loaded at the END of body, AFTER all HTML elements are created -->
    <script src="script.js"></script>

</body>
</html>
